aid: axon
name: Axon
description: >-
  Axon is an early-stage artificial intelligence company building real-time
  predictive intelligence on a brain-inspired architecture. Its approach centers
  on small, efficient "world models" that learn continuously on-device rather
  than depending on large models or the cloud, giving an edge-first design lower
  latency and lower cost. The initial focus is high-frequency trading and capital
  markets, where real-time prediction is decisive, with future applications
  targeted at wearables, edge devices, and robotics. Axon is backed by Northzone,
  Concept Ventures, a16z Speedrun, and EWOR. As of this profile the company is
  pre-product with no public developer API, documentation, SDKs, or developer
  portal; this repository tracks it in the API Evangelist network for enrichment
  as its developer surface emerges.
